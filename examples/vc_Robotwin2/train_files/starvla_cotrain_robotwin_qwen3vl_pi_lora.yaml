run_id: qwenpi_lora
run_root_dir: results/Checkpoints
seed: 42
trackers: [jsonl, wandb]
wandb_entity: your_wandb_entity
wandb_project: llavavla
is_debug: false

framework:
  name: QwenPI
  qwenvl:
    base_vlm: ./playground/Pretrained_models/Qwen3-VL-4B-Instruct
    attn_implementation: flash_attention_2
    vl_hidden_dim: 2048   # dynamically overwritten by QwenPI.__init__ from model.config.hidden_size
    gradient_checkpointing: true  # required: QwenPI LoRA backprops through all 36 hidden states
  dino:
    # [UNUSED by QwenPI] kept for compatibility with other frameworks
    dino_backbone: dinov2_vits14

  action_model:
    action_model_type: DiT-B
    hidden_size: 1024       # ActionEncoder hidden size
    add_pos_embed: True
    max_seq_len: 1024
    action_dim: 14          # robot action dimensionality (abs_qpos for RoboTwin2)
    state_dim: 14
    future_action_window_size: 15   # chunk_len = past + 1 + future = 16
    action_horizon: 16              # documentation alias for chunk_len
    past_action_window_size: 0
    repeated_diffusion_steps: 1
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    num_inference_timesteps: 4      # flow-matching denoising steps at inference
    num_target_vision_tokens: 32    # [UNUSED by LayerwiseFM]
    diffusion_model_cfg:            # LayerwiseFM DiT Transformer parameters
      cross_attention_dim: 2048     # must match vl_hidden_dim
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: "ada_norm"
      num_layers: 16                # overridden at runtime by num_vl_layers from VLM
      output_dim: 14                # must match action_dim
      positional_embeddings: null

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    data_root_dir: /shared/home/ZWA0839/Projects/VisualContextVLA/data/robotwin2/hf_lerobot/lerobot_robotwin_rand20k_debug
    data_mix: robotwin_debug
    action_type: abs_qpos
    action_mode: abs
    sequential_step_sampling: False
    per_device_batch_size: 4
    load_all_data_for_training: true
    obs: ["image_0"]
    image_size: null
    video_backend: pyav

trainer:
  epochs: 100         # [UNUSED by train_starvla.py] trainer uses max_train_steps
  max_train_steps: 1000000
  num_warmup_steps: 5000
  save_interval: 5000
  eval_interval: 100
  learning_rate:
    base: 2e-04           # higher lr for LoRA adapters
    qwen_vl_interface: 2e-04   # only LoRA adapter weights are trainable here (PEFT freezes base)
    action_model: 1e-04        # LayerwiseFM is fully trainable (outside PEFT scope)
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  # Trainability summary:
  #   VLM LLM backbone  → LoRA only (q/k/v/o/gate/up/down projections)
  #   embed_tokens       → FROZEN (PEFT freezes all non-LoRA params; train_action_embeddings=false)
  #   vision encoder     → FROZEN (layer names not in target_modules, unaffected by PEFT)
  #   action_model       → FULL finetune (separate nn.Module, outside PEFT scope)
  freeze_modules: ''
  loss_scale:
    vla: 1.0
    vlm: 0.1           # [UNUSED by train_starvla.py] only used in co-training scripts
  repeated_diffusion_steps: 2
  max_grad_norm: 1.0
  warmup_ratio: 0.1             # [UNUSED by train_starvla.py] scheduler uses num_warmup_steps directly
  weight_decay: 0.0             # [UNUSED] shadowed by optimizer.weight_decay below
  logging_frequency: 10
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08

  lora:
    enable: true
    # dot-path inside the top-level model to the HuggingFace CausalLM object
    vlm_module_path: qwen_vl_interface.model
    r: 16
    lora_alpha: 32
    lora_dropout: 0.05
    # apply LoRA only to LLM attention + MLP projections; vision encoder uses
    # different layer/param names so it is not affected
    target_modules:
      - q_proj
      - k_proj
      - v_proj
      - o_proj
      - gate_proj
      - up_proj
      - down_proj
    # QwenPI uses a diffusion action head (not token prediction), so there are no
    # action token embeddings in the VLM — embed_tokens stays fully frozen (PEFT default).
    train_action_embeddings: false

  is_resume: false
  resume_epoch: null
  resume_step: null
  enable_mixed_precision_training: true
