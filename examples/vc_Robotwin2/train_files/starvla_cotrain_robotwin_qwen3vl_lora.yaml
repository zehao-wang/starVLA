run_id: qwenact_lora
run_root_dir: results/Checkpoints
seed: 42
trackers: [jsonl, wandb]
wandb_entity: your_wandb_entity
wandb_project: llavavla
is_debug: false

framework:
  name: QwenFast
  qwenvl:
    base_vlm: ./playground/Pretrained_models/Qwen3-VL-4B-Instruct
    attn_implementation: flash_attention_2
    vl_hidden_dim: 2048
  dino:
    # [UNUSED by QwenFast] QwenFast does not instantiate a DINO encoder.
    dino_backbone: dinov2_vits14

  action_model:
    # [UNUSED by QwenFast] action_model_type / DiT-specific fields are only used
    # by diffusion-based frameworks. QwenFast uses Fast_Action_Tokenizer (no nn.Parameters).
    action_model_type: DiT-B
    hidden_size: 1024     # [UNUSED by QwenFast]
    add_pos_embed: True   # [UNUSED by QwenFast]
    max_seq_len: 1024     # [UNUSED by QwenFast]
    action_dim: 14        # used by QwenFast: fast_tokenizer.action_dim
    state_dim: 14         # [UNUSED by QwenFast] Fast_Action_Tokenizer does not use state
    future_action_window_size: 15  # used by QwenFast: time_horizon = future_action_window_size + 1 = 16
    action_horizon: 16    # [UNUSED by QwenFast code] code derives horizon from future_action_window_size+1; kept as documentation only
    past_action_window_size: 0     # used by QwenFast: chunk_len = past + 1 + future
    repeated_diffusion_steps: 8   # [UNUSED by QwenFast]
    noise_beta_alpha: 1.5         # [UNUSED by QwenFast]
    noise_beta_beta: 1.0          # [UNUSED by QwenFast]
    noise_s: 0.999                # [UNUSED by QwenFast]
    num_timestep_buckets: 1000    # [UNUSED by QwenFast]
    num_inference_timesteps: 4    # [UNUSED by QwenFast]
    num_target_vision_tokens: 32  # [UNUSED by QwenFast]
    diffusion_model_cfg:          # [UNUSED by QwenFast] DiT Transformer parameters
      cross_attention_dim: 2048
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: "ada_norm"
      num_layers: 16
      output_dim: 2560
      positional_embeddings: null

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    data_root_dir: /shared/home/ZWA0839/Projects/VisualContextVLA/data/robotwin2/hf_lerobot/lerobot_robotwin_rand20k_debug
    data_mix: robotwin_debug
    action_type: abs_qpos
    action_mode: abs
    sequential_step_sampling: False
    per_device_batch_size: 16
    load_all_data_for_training: true
    obs: ["image_0"]
    image_size: null
    video_backend: pyav

trainer:
  epochs: 100         # [UNUSED by train_starvla.py] trainer uses max_train_steps, not epoch count
  max_train_steps: 1000000
  num_warmup_steps: 5000
  save_interval: 5000
  eval_interval: 100
  learning_rate:
    base: 2e-04          # higher lr for LoRA adapters
    qwen_vl_interface: 2e-04
    action_model: 1.0e-04  # [UNUSED by QwenFast] Fast_Action_Tokenizer has no nn.Parameters
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  # LoRA note: vision encoder and all base weights are frozen by PEFT.
  # action_model (Fast_Action_Tokenizer) has no trainable params, no need to freeze.
  # lora.train_action_embeddings selectively unfreezes ONLY the action token rows
  # in embed_tokens via a gradient mask hook, leaving all language token embeddings frozen.
  # In Qwen3-VL, lm_head.weight is tied to embed_tokens.weight (same tensor), so this
  # also enables gradient flow through action token output logits in lm_head.
  freeze_modules: ''
  loss_scale:
    vla: 1.0
    vlm: 0.1           # [UNUSED by train_starvla.py] only used in co-training scripts
  repeated_diffusion_steps: 4   # [UNUSED by QwenFast]
  max_grad_norm: 1.0
  warmup_ratio: 0.1             # [UNUSED by train_starvla.py] scheduler uses num_warmup_steps directly
  weight_decay: 0.0             # [UNUSED] shadowed by optimizer.weight_decay below
  logging_frequency: 10
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08

  lora:
    enable: true
    # dot-path inside the top-level model to the HuggingFace CausalLM object
    vlm_module_path: qwen_vl_interface.model
    r: 16
    lora_alpha: 32
    lora_dropout: 0.05
    # apply LoRA only to LLM attention + MLP projections; vision encoder uses
    # different layer/param names so it is not affected
    target_modules:
      - q_proj
      - k_proj
      - v_proj
      - o_proj
      - gate_proj
      - up_proj
      - down_proj
    # Selectively train ONLY action token rows in embed_tokens (rows _ACTION_TOKEN_MIN to
    # _ACTION_TOKEN_MAX). All other language token embedding rows stay frozen via a gradient
    # mask hook. Since lm_head.weight is tied to embed_tokens.weight in Qwen3-VL, this
    # also enables gradient flow through action token output logits at no extra cost.
    # Action token embeddings are randomly initialized by add_fast_tokens.sh
    # (--init-strategy normal), so this should be enabled when training from scratch.
    train_action_embeddings: true

  is_resume: false
  resume_epoch: null
  resume_step: null
  # enable_gradient_checkpointing: true  # NOTE: config exists but not implemented in trainer; no-op
  enable_mixed_precision_training: true
