run_id: qwenact_lora
run_root_dir: results/Checkpoints
seed: 42
trackers: [jsonl, wandb]
wandb_entity: your_wandb_entity
wandb_project: llavavla
is_debug: false

framework:
  name: QwenFast
  qwenvl:
    base_vlm: ./playground/Pretrained_models/Qwen3-VL-4B-Instruct
    attn_implementation: flash_attention_2
    vl_hidden_dim: 2048
  dino:
    dino_backbone: dinov2_vits14

  action_model:
    action_model_type: DiT-B
    hidden_size: 1024     # 和 DiT 最后的 projection 对应，用于 ActionDecoder
    add_pos_embed: True
    max_seq_len: 1024
    action_dim: 14
    state_dim: 14
    future_action_window_size: 15  # time_horizon = future_action_window_size + 1 = 16, matches robotwin action_indices = range(16)
    action_horizon: 16
    past_action_window_size: 0
    repeated_diffusion_steps: 8
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    num_inference_timesteps: 4
    num_target_vision_tokens: 32
    diffusion_model_cfg:    # DiT Transformers 的参数
      cross_attention_dim: 2048 # VLM 的 dim
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: "ada_norm"
      num_layers: 16
      output_dim: 2560
      positional_embeddings: null

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    data_root_dir: /shared/home/ZWA0839/Projects/VisualContextVLA/data/robotwin2/hf_lerobot/lerobot_robotwin_rand20k_debug
    data_mix: robotwin_debug
    action_type: abs_qpos
    action_mode: abs
    sequential_step_sampling: False
    per_device_batch_size: 16
    load_all_data_for_training: true
    obs: ["image_0"]
    image_size: null
    video_backend: pyav

trainer:
  epochs: 100
  max_train_steps: 1000000
  num_warmup_steps: 5000
  save_interval: 5000
  eval_interval: 100
  learning_rate:
    base: 2e-04          # higher lr for LoRA adapters
    qwen_vl_interface: 2e-04
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  # vision encoder, embed_tokens, and action token embeddings are frozen by PEFT LoRA.
  # action_model (Fast_Action_Tokenizer) has no trainable params, no need to freeze.
  freeze_modules: ''
  loss_scale:
    vla: 1.0
    vlm: 0.1
  repeated_diffusion_steps: 4
  max_grad_norm: 1.0
  warmup_ratio: 0.1
  weight_decay: 0.0
  logging_frequency: 10
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08

  lora:
    enable: true
    # dot-path inside the top-level model to the HuggingFace CausalLM object
    vlm_module_path: qwen_vl_interface.model
    r: 16
    lora_alpha: 32
    lora_dropout: 0.05
    # apply LoRA only to LLM attention + MLP projections; vision encoder uses
    # different layer/param names so it is not affected
    target_modules:
      - q_proj
      - k_proj
      - v_proj
      - o_proj
      - gate_proj
      - up_proj
      - down_proj

  is_resume: false
  resume_epoch: null
  resume_step: null
  # enable_gradient_checkpointing: true  # NOTE: config exists but not implemented in trainer; no-op
  enable_mixed_precision_training: true
